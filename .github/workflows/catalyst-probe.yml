name: Catalyst curve signature probe

on:
  push:
    branches:
      - forensics/catalyst-20260821
    paths:
      - forensics/catalyst/probe.py
      - .github/workflows/catalyst-probe.yml

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests solders
      - run: python forensics/catalyst/probe.py
      - if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forensics/catalyst/output/probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record catalyst curve probe'
          git push origin HEAD:${GITHUB_REF_NAME}
