name: Catalyst public-chain forensics

on:
  push:
    branches:
      - forensics/catalyst-20260821
    paths:
      - forensics/catalyst/collector.py
      - .github/workflows/catalyst-forensics.yml

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests solders

      - name: Reconstruct Pump.fun bonding-curve history
        env:
          MAX_SIGS: '30000'
          BATCH: '20'
        run: python forensics/catalyst/collector.py

      - name: Save evidence outputs
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forensics/catalyst/output
          if git diff --cached --quiet; then
            echo 'No output changes.'
            exit 0
          fi
          git commit -m 'Record catalyst raw on-chain evidence'
          git push origin HEAD:${GITHUB_REF_NAME}
